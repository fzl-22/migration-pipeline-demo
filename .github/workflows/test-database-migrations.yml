name: Test Database Migrations

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - master
      - staging
      - development
  # for debugging purpose
  workflow_dispatch:

jobs:
  test-migrate:
    name: Test DB Migrations
    runs-on: ubuntu-latest

    container: amfaisal/golang-migrate:latest

    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test migrations
        working-directory: ./database-migrations
        env:
            DB_DEMO_MASTER_USER: test_user
            DB_DEMO_MASTER_PASSWORD: test_password
            DB_DEMO_MASTER_HOST: postgres
            DB_DEMO_MASTER_NAME: test_db
            DB_DEMO_MASTER_SSLMODE: disable
        run: |
          make migrate-up
          make migrate-down ALL=true
        