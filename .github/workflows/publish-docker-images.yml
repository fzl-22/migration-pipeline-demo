name: Publish Docker Images

on:
  push:
    branches:
      - master
      - staging
      - development
  # for debugging purpose
  workflow_dispatch:

jobs:
  find-images:
    name: Find Docker Images
    runs-on: ubuntu-latest
    outputs:
      IMAGES: ${{ steps.list-images.outputs.IMAGE_LIST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Generate list of image directories
        id: list-images
        run: |
          IMAGE_LIST=$(ls -d docker-images/* | xargs -n 1 basename | jq -R . | jq -s -c .)
          echo "Discovered images: ${IMAGE_LIST}"
          echo "IMAGE_LIST=${IMAGE_LIST}" >> $GITHUB_OUTPUT

  publish-images:
    name: Publish ${{ matrix.image }} Docker Images
    runs-on: ubuntu-latest
    needs: find-images
    strategy:
      matrix:
        image: ${{ fromJson(needs.find-images.outputs.IMAGES) }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

