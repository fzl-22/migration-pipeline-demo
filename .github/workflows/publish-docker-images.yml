name: Publish Docker Images

on:
  push:
    branches:
      - master
      - staging
      - development
  # for debugging purpose
  workflow_dispatch:

jobs:
  find-images:
    name: Find Docker Images
    runs-on: ubuntu-latest
    outputs:
      IMAGES: ${{ steps.list-images.outputs.IMAGE_LIST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      - name: Generate list of image directories
        id: list-images
        run: |
          if [ ${{ github.event_name }} == "workfllow_dispatch" ]; then
            echo "Workflow was manually dispatched, running for all images..."
            IMAGE_LIST=$(ls -d docker-images/* | xargs -n 1 basename | jq -R . | jq -s -c .)
          else
            echo "Finding changed images between ${{ github.event.before }} and ${{ github.sha }}"
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
            echo "Changed files:"
            echo "${CHANGED_FILES}"
            IMAGE_LIST=$(echo "${CHANGED_FILES}" | sed -n 's;^docker-images/\([^/]*\)/.*$;\1;p' | sort -u | jq -R . | jq -s -c .)
          fi
          echo "Discovered images: ${IMAGE_LIST}"
          echo "IMAGE_LIST=${IMAGE_LIST}" >> $GITHUB_OUTPUT

  publish-images:
    name: Publish ${{ matrix.image }} Docker Images
    runs-on: ubuntu-latest
    needs: find-images
    strategy:
      matrix:
        image: ${{ fromJson(needs.find-images.outputs.IMAGES) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
    
      - name: Debug Directory Listing
        run: |
          echo "Current working directory: $(pwd)"
          echo "---"
          echo "Listing contents of the repository root:"
          ls -laR

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./docker-images/${{ matrix.image }}
          file: ./docker-images/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

